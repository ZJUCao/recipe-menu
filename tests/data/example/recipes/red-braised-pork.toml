name = { zh = "红烧肉", en = "Red-braised pork belly" }
servings = 2
tags = ["家常"]

ingredients = [
  { item = "五花肉", amount = "1 斤", note = { zh = "切成 3 厘米见方的块", en = "cut into 3 cm cubes" } },
  { item = "冰糖", amount = "30 g" },
  { item = "生抽", amount = "2 tbsp" },
  { item = "姜", amount = "3 片" },
  { item = "葱", amount = "2 根" },
]

[steps]
zh = [
  "五花肉冷水下锅，焯水后捞出。",
  "小火把冰糖炒成焦糖色，下五花肉翻炒上色。",
  "加生抽、姜片和热水，没过肉，小火炖 1 小时。",
  "大火收汁，撒上葱段。",
]
